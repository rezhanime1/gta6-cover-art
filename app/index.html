<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="panel" aria-label="Cover controls">
    <h1>VICE COVER</h1>
    <p class="tag">Turn a photo and a caption into GTA-style poster art.</p>

    <div class="group">
      <span class="label">Photo</span>
      <div class="row">
        <button type="button" data-photo="pier" class="pick">Pier</button>
        <button type="button" data-photo="boulevard" class="pick">Boulevard</button>
        <label class="upload">Upload
          <input id="upload" type="file" accept="image/*">
        </label>
      </div>
    </div>

    <div class="group">
      <label class="label" for="title">Title</label>
      <input id="title" type="text" maxlength="32" value="SUNSET HEIST">
      <label class="label" for="subtitle">Subtitle</label>
      <input id="subtitle" type="text" maxlength="48" value="VICE CITY • 2026">
    </div>

    <div class="group">
      <span class="label">Colour grade</span>
      <div class="row">
        <button type="button" data-grade="sunset" class="pick">Sunset</button>
        <button type="button" data-grade="neon" class="pick">Neon Night</button>
        <button type="button" data-grade="noir" class="pick">Noir</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Panel layout</span>
      <div class="row wrap">
        <button type="button" data-layout="triptych" class="pick">Triptych</button>
        <button type="button" data-layout="split" class="pick">Split</button>
        <button type="button" data-layout="hero" class="pick">Hero</button>
        <button type="button" data-layout="stack" class="pick">Stack</button>
      </div>
    </div>

    <div class="group">
      <label class="label" for="size">Export size</label>
      <select id="size">
        <option value="1080x1080">1080 × 1080 (square)</option>
        <option value="1080x1350">1080 × 1350 (portrait)</option>
        <option value="1920x1080">1920 × 1080 (wide)</option>
      </select>
    </div>

    <div class="group">
      <label class="label" for="zoom">Zoom <span id="zoomVal"></span></label>
      <input id="zoom" type="range" min="0.8" max="2" step="0.05" value="1">
      <label class="label" for="panx">Pan sideways</label>
      <input id="panx" type="range" min="-0.25" max="0.25" step="0.01" value="0">
      <label class="label" for="pany">Pan up / down</label>
      <input id="pany" type="range" min="-0.25" max="0.25" step="0.01" value="0">
    </div>

    <button id="export" type="button" class="go">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="poster" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
